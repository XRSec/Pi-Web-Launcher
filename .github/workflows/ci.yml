name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug
        run: swift build

      - name: Build release
        run: ./build-app.sh
        env:
          INSTALL_APP: "0"
